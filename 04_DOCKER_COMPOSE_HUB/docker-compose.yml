version: '3.8'

networks:
  custom-network:
    driver: bridge
    ipam:
      config:
        - subnet : 172.30.0.0/24
          gateway : 172.30.0.1

services:
  fn:
    image: doidori/yth-init:fn
    container_name: fn-container
    ports:
      - "3000:80"
    depends_on:
      bn:
        condition: service_healthy
    networks:
      custom-network:
        ipv4_address: 172.30.0.10
  bn:
    image: doidori/yth-init:bn
    container_name: bn-container
    ports:
      - "8090:8090"
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl -f -s http://127.0.0.1:8090/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-container:3306/testdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Zhfldk11!
      SPRING_REDIS_HOST: redis
      SERVER_PORT: 8090
    depends_on:
      db:
        condition: service_healthy
    networks:
      custom-network:
        ipv4_address: 172.30.0.20
  db:
    image: doidori/yth-init:db
    container_name: db-container
    networks:
      custom-network:
        ipv4_address: 172.30.0.30
    ports:
      - "3330:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      # - ./DB/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db-data:/var/lib/mysql   # 
    environment:
      MYSQL_ROOT_PASSWORD: Zhfldk11!
      MYSQL_DATABASE: testdb
      MYSQL_USER: dbconn
      MYSQL_PASSWORD: Zhfldk11!
      MYSQL_ROOT_HOST: '%'

  redis:
    image: doidori/yth-init:redis
    container_name: redis-container
    ports:
      - "6380:6379"
    networks:
      custom-network:
        ipv4_address: 172.30.0.40

volumes:
  db-data:
# volumes : 데이터가 쌓이도록 설정 없으면 -> docker 껏다 키면 데이터가 날라감